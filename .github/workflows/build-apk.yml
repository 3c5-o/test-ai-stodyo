name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystores & Environment Files
        run: |
          # Fix potential line-ending issues on gradlew
          sed -i 's/\r$//' gradlew 2>/dev/null || true
          chmod +x gradlew

          # Create app directory if not existing
          mkdir -p app

          # Restore official release keystore from base64 if needed
          if [ -f "my-upload-key.base64" ]; then
            base64 -d my-upload-key.base64 > my-upload-key.jks
          fi

          # Ensure release keystore is present in root and app subfolder
          if [ -f "my-upload-key.jks" ]; then
            cp my-upload-key.jks app/my-upload-key.jks
          else
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mobily Pro,OU=Mobile Store,O=MobilyPro,L=Baghdad,ST=Baghdad,C=IQ"
            cp my-upload-key.jks app/my-upload-key.jks
          fi

          # Restore debug.keystore from base64 if present, or generate fresh
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore app/debug.keystore 2>/dev/null || true

          # Ensure .env file exists for Secrets Gradle Plugin
          touch .env
          touch app/.env

      - name: Build Android APKs (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
          KEYSTORE_PATH: "my-upload-key.jks"

      - name: Verify APK Signatures (v1, v2, v3)
        run: |
          echo "=== فحص توقيع نسخة الإنتاج Release APK ==="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk || true
          echo "=== فحص توقيع نسخة التطوير Debug APK ==="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobilyPro-Release-Official-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobilyPro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: release-${{ github.run_number }}
          name: "مبايلي برو APK - إصدار رسمي #${{ github.run_number }}"
          body: |
            ### 📱 تطبيق مبايلي برو (Mobily Pro) - إدارة محلات الهواتف والصيانة
            
            تم بناء ملفات التطبيق وتوقيعها رقمياً بنجاح عبر خوادم GitHub Actions مع تفعيل مخططات التوقيع (v1 JAR + v2 APK Scheme + v3).
            
            - **رقم البناء**: `${{ github.run_number }}`
            - **الأيقونة**: أيقونة مخصصة عصرية مدمجة في الحزمة
            - **التوقيع**: توقيع رقمي معتمد متوافق مع كافة أجهزة أندرويد 🚀
            
            #### 📥 ملفات التطبيق في المرفقات (Assets):
            
            1. **`app-release.apk` (النسخة الرسمية الموصى بها ⭐)**:
               - النسخة الموقعة بشهادة Keystore الرسمية بحجم تقريبي 19MB.
               
            2. **`app-debug.apk` (نسخة تجريبية)**:
               - نسخة مطورين بديلة لمن يواجه أي مشكلة في تثبيت النسخة الرسمية.
            
            #### ⚠️ ملاحظة هامة لتفادي خطأ "حدثت مشكلة أثناء تثبيت الحزمة":
            1. **إذا كان التطبيق مثبتاً لديك مسبقاً**: يجب **إلغاء تثبيت النسخة القديمة تماماً** من هاتفك أولاً، ثم تثبيت هذا الملف لتجنب تعارض التوقيع.
            2. **تفعيل إذن التثبيت**: تأكد من السماح لمتصفحك بتثبيت التطبيقات من مصادر غير معروفة.
            3. **التأكد من اكتمال التنزيل**: احرص على تنزيل ملف `.apk` كامل الحجم.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
