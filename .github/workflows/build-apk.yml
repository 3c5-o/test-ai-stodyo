name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment Files
        run: |
          # Restore debug.keystore from base64 if not present in checkout
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Ensure .env file exists for Secrets Gradle Plugin
          touch .env
          # Ensure gradlew has executable permissions
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobilyPro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: release-${{ github.run_number }}
          name: "مبايلي برو APK - إصدار تلقائي #${{ github.run_number }}"
          body: |
            ### 📱 تطبيق مبايلي برو (Mobily Pro) - إدارة محلات الهواتف والصيانة
            
            تم بناء ملف التطبيق بنجاح وبشكل آلي عبر خوادم GitHub Actions السحابية.
            
            - **رقم البناء**: `${{ github.run_number }}`
            - **الفرع**: `${{ github.ref_name }}`
            - **الحالة**: ناجح وجاهز للتثبيت الفوري 🚀
            
            #### 📥 طريقة التثبيت على الهاتف:
            1. قم بتحميل ملف `app-debug.apk` الموجود في المرفقات (Assets) أدناه.
            2. افتح الملف على هاتفك واضغط **تثبيت (Install)**.
            3. إذا طلب هاتفك تفعيل "تثبيت التطبيقات من مصادر غير معروفة"، وافق لمرة واحدة.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
