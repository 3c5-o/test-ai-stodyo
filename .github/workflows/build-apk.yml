name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobilyPro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "مبايلي برو APK - إصدار تلقائي #${{ github.run_number }}"
          body: |
            ### 📱 تطبيق مبايلي برو (Mobily Pro) - إدارة محلات الهواتف والصيانة
            
            تم بناء ملف التطبيق بنجاح وبشكل آلي عبر GitHub Actions.
            
            - **تاريخ البناء**: ${{ github.event.head_commit.timestamp || 'Manual Trigger' }}
            - **رقم البناء**: `${{ github.run_number }}`
            - **فرع الكود**: `${{ github.ref_name }}`
            
            #### 📥 طريقة التثبيت على الهاتف:
            1. قم بتحميل ملف `app-debug.apk` الموجود في المرفقات أدناه.
            2. افتح الملف على هاتفك الأندرويد واضغط **تثبيت (Install)**.
            3. إذا ظهر تنبيه تثبيت التطبيقات غير المعروفة، اسمح بالتثبيت لمرة واحدة.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
